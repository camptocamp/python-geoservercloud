name: Continuous integration

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

env:
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    outputs:
      success: ${{ steps.success.outputs.success }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt
        name: Install CI requirements
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
      - run: pre-commit run --all-files
        env:
          SKIP: poetry-lock,isort
      - run: git diff && false
        if: failure()

      - name: Install
        run: make install

      - name: Tests
        run: make tests

      # Mark as success
      - id: success
        run: echo "success=true" >> $GITHUB_OUTPUT

  acceptance-tests:
    name: Run acceptance tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    env:
      GEOSERVER_ACCEPTANCE_CONFIG: ${{ github.workspace }}/geoserver_acceptance_tests/ci.config.yaml
      GEOSERVER_URL: http://localhost:8080/geoserver
      GEOSERVER_USER: admin
      GEOSERVER_PASSWORD: geoserver
      GEOSERVER_PG_HOST_LOCAL: localhost
      GEOSERVER_PG_PORT_LOCAL: 6432
      GEOSERVER_PG_HOST_DOCKER: geodatabase
      GEOSERVER_PG_PORT_DOCKER: 5432
      GEOSERVER_PG_DB: acceptance
      GEOSERVER_PG_USER: geoserver
      GEOSERVER_PG_PASSWORD: geoserver
      GEOSERVER_PG_SCHEMA: public
      # Minimal test suite - only enable basic tests
      GEOSERVER_ACCEPTANCE_RUN_DB_TESTS: true
      GEOSERVER_ACCEPTANCE_RUN_SLOW_TESTS: false
      GEOSERVER_ACCEPTANCE_RUN_COG_TESTS: false
      GEOSERVER_ACCEPTANCE_RUN_JNDI_TESTS: true
      GEOSERVER_ACCEPTANCE_RUN_AWS_S3_TESTS: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - run: echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - name: Install python-geoservercloud from source
        run: make install

      - name: Extract test data
        run: |
          make acceptance-tests-setup

      - name: Pull GeoServer Docker image
        run: docker pull docker.osgeo.org/geoserver:3.0.x

      - name: Start Docker Compose services
        run: |
          make acceptance-tests-up

      - name: Run acceptance tests
        run: |
          poetry run pytest --pyargs geoserver_acceptance_tests.tests -v --color=yes

      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-test-failures
          path: |
            geoserver_acceptance_tests/compose/geoserver_data/
            **/*.log

      - name: Print Docker logs
        if: always()
        run: make acceptance-tests-logs

      - name: Shutdown Docker Compose
        if: always()
        run: make acceptance-tests-down

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: build
    if: always()

    permissions:
      contents: read
      id-token: write

    steps:
      - run: '[[ "${{ needs.build.outputs.success }}" == "true" ]]'

      # The full history is required to compute the version from the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Provides the pip, python3 and poetry that tag-publish calls to build the wheel.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          cache-python: true
          python-version: "3.14"

      # tag-publish connects itself to PyPI with OpenId Connect, and only when the context publishes.
      - name: Publish
        run: uv run --locked --isolated --no-build --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
